name: Bug report
description: Report a problem in choppa.lol
labels: [bug]

body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you did, what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Add a screenshot or short video if it helps.

  - type: input
    id: system
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

